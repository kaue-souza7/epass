{% block override_home %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/overrides/b-admin.css') }}">
{%endblock%}


{% block content %} 

<body>
    <aside class="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
            <img 
                src="../static/media/logo.png" 
                alt="Logo" 
                style="width:200px; height:auto;"
            >
        </div>

        <!-- Navegação -->
        <nav class="sidebar-nav">

            <a href="{{ url_for('dashboard') }}" target="frame" class="nav-item">
                <span class="material nav-icon">dashboard</span>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('home') }}" target="frame" class="nav-item">
                <span class="material nav-icon">person_add</span>
                <span>Cadastros</span>
            </a>

            <a href="{{ url_for('gestao_academica') }}" target="frame" class="nav-item">
                <span class="material nav-icon">school</span>
                <span>Gestão Acadêmica</span>
            </a>

            <a href="{{ url_for('gestao_administrativa') }}" target="frame" class="nav-item">

            </a>

                <span class="material nav-icon">upload</span>

            </a>

            <a href="{{ url_for('alertas') }}" target="frame" class="nav-item">
                <span class="material nav-icon">notifications_active</span>

            </a>

            <a href="{{ url_for('calendario') }}" target="frame" class="nav-item">

            </a>

        </nav>

        <!-- Rodapé -->
        <div class="sidebar-footer">
            <a href="../general/configuracoes.html" target="frame" class="nav-item">
                <span class="material nav-icon">settings</span>
                <span>Configurações</span>
            </a>

            <div class="user-card" style="margin-top:10px;">
                <div class="user-avatar">AD</div>
                <div>
                    <div class="user-name">Admin</div>
                    <div class="user-role">Administrador</div>
                </div>
            </div>
        </div>
    </aside>
